[versions]
# Build tooling
agp = "9.1.1"
kotlin = "2.4.20"
jvm-target = "21"
ksp = "2.3.12"

# Android SDK
android-compile-sdk = "37"
android-min-sdk = "29"
android-target-sdk = "37"

# App
app-version-code = "1"
app-version-name = "1.0"

# Android
activity = "1.13.0"
appcompat = "1.8.0"
core = "1.19.1"
credentials = "1.6.0"
datastore = "1.2.1"
lifecycle = "2.11.0"

# Coroutines
kotlinx-coroutines = "1.10.2"

# Serialization
kotlinx-serialization = "1.12.0"

# Date and time
kotlinx-datetime = "0.8.0"

# Networking
ktor = "3.6.0"
koog = "1.3.0"

# Database
room = "3.0.3"
sqlite = "2.7.1"

# Firebase and Google Sign-In
firebase-bom = "34.19.0"
firebase-ios-sdk = "12.19.2"
googleid = "1.2.1"
google-services = "4.5.0"
google-signin-ios = "10.0.0"

# Compose Multiplatform
compose-multiplatform = "1.12.1"
material3 = "1.12.0-alpha03"

# Navigation
navigation3 = "1.1.2"

# koin
koin = "4.2.2"
koin-plugin = "1.2.1"

# Code quality
detekt = "1.23.8"

# Testing
espresso = "3.7.0"
junit = "4.13.2"
test-ext = "1.3.0"

[libraries]
# Android
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }
credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }

# Coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "kotlinx-coroutines" }

# Serialization: the compiler plugin comes with `chat.multiplatform.library`; this is the JSON runtime. The BOM keeps
# the artifacts Room pulls in at an older version, such as `kotlinx-serialization-json-okio`, on the same one
kotlinx-serialization-bom = { module = "org.jetbrains.kotlinx:kotlinx-serialization-bom", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json" }

# Date and time: local clock times and dates of `kotlin.time.Instant`s, in the device's time zone
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

# Networking: Ktor's client, on OkHttp for Android and NSURLSession (Darwin) for iOS
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
koog-http-client-ktor = { module = "ai.koog:http-client-ktor", version.ref = "koog" }
koog-prompt-executor-openai-client = { module = "ai.koog:prompt-executor-openai-client", version.ref = "koog" }

# Firebase and Google Sign-In: the iOS SDKs come through SwiftPM, see `swiftPMDependencies` in :data:auth and :feature:auth
firebase-auth = { module = "com.google.firebase:firebase-auth" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }

# Database: Room 3 (`androidx.room3`) on the bundled SQLite driver; `chat.room` adds runtime, driver and compiler
room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }
room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

# DataStore
datastore-core-okio = { module = "androidx.datastore:datastore-core-okio", version.ref = "datastore" }
datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }

# Compose Multiplatform
compose-animation = { module = "org.jetbrains.compose.animation:animation", version.ref = "compose-multiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose-multiplatform" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
compose-ui-util = { module = "org.jetbrains.compose.ui:ui-util", version.ref = "compose-multiplatform" }

# Navigation 3: the runtime is published by androidx and the UI by JetBrains, on one shared version
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3" }

# Koin
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-annotations = { module = "io.insert-koin:koin-annotations", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }

# Code quality
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }

# Testing
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
room-testing = { module = "androidx.room3:room3-testing", version.ref = "room" }
# The desktop build of the bundled driver: its jar carries the macOS, Linux and Windows natives the Android host tests load
sqlite-bundled-jvm = { module = "androidx.sqlite:sqlite-bundled-jvm", version.ref = "sqlite" }
test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "test-ext" }

# ================================================================
# Dependencies of the included build-logic
# ================================================================
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
compose-gradle-plugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose-multiplatform" }
detekt-gradle-plugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
room-gradle-plugin = { module = "androidx.room3:room3-gradle-plugin", version.ref = "room" }

[bundles]
koin = ["koin-core", "koin-annotations"]
koin-compose = ["koin-compose", "koin-compose-viewmodel"]

[plugins]
# Android
android-application = { id = "com.android.application", version.ref = "agp" }
android-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }

# Firebase
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }

# Kotlin
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

# Compose Multiplatform
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }

# Database
room = { id = "androidx.room3", version.ref = "room" }

# Koin
koin-compiler = { id = "io.insert-koin.compiler.plugin", version.ref = "koin-plugin" }

# Code quality
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }

# ================================================================
#  Plugins defined by this project
# ================================================================
chat-android-application = { id = "chat.android.application" }
chat-compose-library = { id = "chat.compose.library" }
chat-detekt = { id = "chat.detekt" }
chat-koin = { id = "chat.koin" }
chat-multiplatform-library = { id = "chat.multiplatform.library" }
chat-room = { id = "chat.room" }
